<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PricePulse">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    
    <title>PricePulse Mobile - Smart Price Comparison</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    
    <style>
        /* Custom mobile styles */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        
        /* Hide scrollbars but keep functionality */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Line clamp utility */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Loading animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        /* Mobile-specific improvements */
        input, select, textarea {
            font-size: 16px; /* Prevents zoom on iOS */
        }
        
        /* Safe area for iPhone X+ */
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Touch-friendly buttons */
        button {
            min-height: 44px;
            min-width: 44px;
        }
        
        /* Prevent text selection on buttons */
        button, .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-gray-50 overflow-x-hidden">
    <div id="root"></div>
    
    <!-- PWA Manifest -->
    <script>
        // PWA Manifest
        const manifest = {
            "name": "PricePulse Mobile",
            "short_name": "PricePulse",
            "description": "Smart price comparison for products and services",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#2563eb",
            "orientation": "portrait",
            "icons": [
                {
                    "src": "/icon-192x192.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "/icon-512x512.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        
        // Create manifest blob and link
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <!-- Mobile App Component -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            Search, ShoppingCart, Star, MapPin, Clock, DollarSign, 
            Filter, Heart, Share2, ExternalLink, Zap, TrendingUp,
            Package, Wrench, Home, User, Menu, X, ChevronRight,
            Shield, Award, Globe, Smartphone
        } = lucideReact;

        // Mobile-optimized PricePulse App
        const PricePulseMobile = () => {
            const [activeTab, setActiveTab] = useState('search');
            const [searchQuery, setSearchQuery] = useState('');
            const [searchType, setSearchType] = useState('products');
            const [searchResults, setSearchResults] = useState(null);
            const [loading, setLoading] = useState(false);
            const [showFilters, setShowFilters] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [currency, setCurrency] = useState('USD');
            const [location, setLocation] = useState('');
            const [recentSearches, setRecentSearches] = useState([
                'iPhone 15', 'Laptop', 'Web Development', 'Cleaning Service'
            ]);

            const API_BASE_URL = 'https://60h5imclkgvv.manus.space/api';

            // Mobile-optimized search function
            const handleSearch = async () => {
                if (!searchQuery.trim()) return;

                setLoading(true);
                try {
                    const endpoint = searchType === 'products' ? 'smart-search' : 'service-search';
                    const params = new URLSearchParams({
                        q: searchQuery,
                        currency: currency,
                        max_results: '15'
                    });
                    
                    if (location) params.append('location', location);

                    const response = await fetch(`${API_BASE_URL}/${endpoint}?${params}`);
                    const data = await response.json();
                    setSearchResults(data);
                    
                    // Add to recent searches
                    if (!recentSearches.includes(searchQuery)) {
                        setRecentSearches([searchQuery, ...recentSearches.slice(0, 3)]);
                    }
                } catch (error) {
                    console.error('Search error:', error);
                } finally {
                    setLoading(false);
                }
            };

            const toggleFavorite = (item) => {
                const itemId = item.id || item.title;
                if (favorites.includes(itemId)) {
                    setFavorites(favorites.filter(id => id !== itemId));
                } else {
                    setFavorites([...favorites, itemId]);
                }
            };

            const formatPrice = (item) => {
                if (searchType === 'products') {
                    return item.total_cost ? `${currency} ${item.total_cost.toFixed(2)}` : 'N/A';
                } else {
                    if (item.starting_price) return `${currency} ${item.starting_price}+`;
                    if (item.hourly_rate) return `${currency} ${item.hourly_rate}/hr`;
                    if (item.bid_amount) return `${currency} ${item.bid_amount}`;
                    return 'Quote';
                }
            };

            const getPlatformIcon = (platform) => {
                const icons = {
                    'Amazon': '🛒', 'eBay': '🏪', 'AliExpress': '🏮', 'Walmart': '🏬',
                    'Best Buy': '💻', 'Temu': '🎁', 'Fiverr': '💼', 'Upwork': '👨‍💻',
                    'Freelancer': '🔧', 'TaskRabbit': '🏠', 'Thumbtack': '🔨', 'Angie': '🏡'
                };
                return icons[platform] || '🛍️';
            };

            // Mobile Navigation Component
            const MobileNav = () => (
                React.createElement('div', {
                    className: "fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 safe-area-bottom"
                },
                    React.createElement('div', {
                        className: "flex justify-around py-2"
                    },
                        [
                            { id: 'search', icon: Search, label: 'Search' },
                            { id: 'favorites', icon: Heart, label: 'Favorites' },
                            { id: 'recent', icon: Clock, label: 'Recent' },
                            { id: 'profile', icon: User, label: 'Profile' }
                        ].map(tab => 
                            React.createElement('button', {
                                key: tab.id,
                                onClick: () => setActiveTab(tab.id),
                                className: `flex flex-col items-center py-2 px-4 ${
                                    activeTab === tab.id ? 'text-blue-600' : 'text-gray-500'
                                }`
                            },
                                React.createElement(tab.icon, { className: "h-5 w-5 mb-1" }),
                                React.createElement('span', { className: "text-xs" }, tab.label)
                            )
                        )
                    )
                )
            );

            // Search Header Component
            const SearchHeader = () => (
                React.createElement('div', {
                    className: "bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 pb-6"
                },
                    React.createElement('div', {
                        className: "flex items-center justify-between mb-4"
                    },
                        React.createElement('div', {
                            className: "flex items-center space-x-2"
                        },
                            React.createElement(TrendingUp, { className: "h-6 w-6" }),
                            React.createElement('h1', { className: "text-xl font-bold" }, "PricePulse")
                        ),
                        React.createElement('button', {
                            onClick: () => setShowFilters(!showFilters),
                            className: "p-2 rounded-full bg-white/20"
                        },
                            React.createElement(Filter, { className: "h-5 w-5" })
                        )
                    ),
                    
                    // Search Type Toggle
                    React.createElement('div', {
                        className: "flex bg-white/20 rounded-lg p-1 mb-4"
                    },
                        React.createElement('button', {
                            onClick: () => setSearchType('products'),
                            className: `flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors ${
                                searchType === 'products' 
                                    ? 'bg-white text-blue-600' 
                                    : 'text-white/80'
                            }`
                        },
                            React.createElement(Package, { className: "h-4 w-4 inline mr-2" }),
                            "Products"
                        ),
                        React.createElement('button', {
                            onClick: () => setSearchType('services'),
                            className: `flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors ${
                                searchType === 'services' 
                                    ? 'bg-white text-blue-600' 
                                    : 'text-white/80'
                            }`
                        },
                            React.createElement(Wrench, { className: "h-4 w-4 inline mr-2" }),
                            "Services"
                        )
                    ),
                    
                    // Search Bar
                    React.createElement('div', {
                        className: "relative"
                    },
                        React.createElement('input', {
                            type: "text",
                            placeholder: `Search ${searchType}...`,
                            value: searchQuery,
                            onChange: (e) => setSearchQuery(e.target.value),
                            onKeyPress: (e) => e.key === 'Enter' && handleSearch(),
                            className: "w-full py-3 px-4 pr-12 rounded-lg text-gray-900 placeholder-gray-500"
                        }),
                        React.createElement('button', {
                            onClick: handleSearch,
                            disabled: loading,
                            className: "absolute right-2 top-1/2 transform -translate-y-1/2 bg-blue-600 text-white p-2 rounded-lg"
                        },
                            loading ? 
                                React.createElement('div', {
                                    className: "animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"
                                }) :
                                React.createElement(Search, { className: "h-4 w-4" })
                        )
                    ),
                    
                    // Filters Panel
                    showFilters && React.createElement('div', {
                        className: "mt-4 bg-white/10 rounded-lg p-4"
                    },
                        React.createElement('div', {
                            className: "grid grid-cols-2 gap-4"
                        },
                            React.createElement('div', {},
                                React.createElement('label', {
                                    className: "block text-sm font-medium mb-2"
                                }, "Currency"),
                                React.createElement('select', {
                                    value: currency,
                                    onChange: (e) => setCurrency(e.target.value),
                                    className: "w-full py-2 px-3 rounded-md text-gray-900"
                                },
                                    React.createElement('option', { value: "USD" }, "USD ($)"),
                                    React.createElement('option', { value: "EUR" }, "EUR (€)"),
                                    React.createElement('option', { value: "GBP" }, "GBP (£)"),
                                    React.createElement('option', { value: "ZAR" }, "ZAR (R)")
                                )
                            ),
                            React.createElement('div', {},
                                React.createElement('label', {
                                    className: "block text-sm font-medium mb-2"
                                }, "Location"),
                                React.createElement('input', {
                                    type: "text",
                                    placeholder: "Your location",
                                    value: location,
                                    onChange: (e) => setLocation(e.target.value),
                                    className: "w-full py-2 px-3 rounded-md text-gray-900"
                                })
                            )
                        )
                    )
                )
            );

            // Item Card Component
            const ItemCard = ({ item, index }) => {
                const isProduct = searchType === 'products';
                const isFavorite = favorites.includes(item.id || item.title);

                return React.createElement('div', {
                    className: "bg-white rounded-lg shadow-md p-4 mb-4 border border-gray-100"
                },
                    React.createElement('div', {
                        className: "flex justify-between items-start mb-3"
                    },
                        React.createElement('div', {
                            className: "flex-1"
                        },
                            React.createElement('div', {
                                className: "flex items-center space-x-2 mb-2"
                            },
                                React.createElement('span', {
                                    className: "text-lg"
                                }, getPlatformIcon(item.platform)),
                                React.createElement('span', {
                                    className: "text-xs font-medium text-gray-500 bg-gray-100 px-2 py-1 rounded"
                                }, item.platform),
                                item.recommendation_level && React.createElement('span', {
                                    className: `text-xs px-2 py-1 rounded ${
                                        item.recommendation_level === 'Highly Recommended' 
                                            ? 'bg-green-100 text-green-800'
                                            : item.recommendation_level === 'Recommended'
                                            ? 'bg-blue-100 text-blue-800'
                                            : 'bg-yellow-100 text-yellow-800'
                                    }`
                                }, item.recommendation_level)
                            ),
                            React.createElement('h3', {
                                className: "font-semibold text-gray-900 mb-2 line-clamp-2"
                            }, item.title),
                            React.createElement('div', {
                                className: "flex items-center space-x-4 text-sm text-gray-600 mb-2"
                            },
                                (item.rating || item.provider_rating) && React.createElement('div', {
                                    className: "flex items-center space-x-1"
                                },
                                    React.createElement(Star, {
                                        className: "h-4 w-4 text-yellow-500 fill-current"
                                    }),
                                    React.createElement('span', {}, `${item.rating || item.provider_rating}/5`)
                                ),
                                item.location && React.createElement('div', {
                                    className: "flex items-center space-x-1"
                                },
                                    React.createElement(MapPin, { className: "h-4 w-4" }),
                                    React.createElement('span', {
                                        className: "truncate"
                                    }, item.location)
                                ),
                                (item.delivery_time || item.response_time) && React.createElement('div', {
                                    className: "flex items-center space-x-1"
                                },
                                    React.createElement(Clock, { className: "h-4 w-4" }),
                                    React.createElement('span', {}, item.delivery_time || item.response_time)
                                )
                            )
                        ),
                        React.createElement('button', {
                            onClick: () => toggleFavorite(item),
                            className: `p-2 rounded-full ${
                                isFavorite ? 'text-red-500' : 'text-gray-400'
                            }`
                        },
                            React.createElement(Heart, {
                                className: `h-5 w-5 ${isFavorite ? 'fill-current' : ''}`
                            })
                        )
                    ),
                    
                    React.createElement('div', {
                        className: "flex items-center justify-between"
                    },
                        React.createElement('div', {},
                            React.createElement('div', {
                                className: "text-2xl font-bold text-green-600"
                            }, formatPrice(item)),
                            isProduct && item.savings_amount && React.createElement('div', {
                                className: "text-sm text-green-600"
                            }, `Save ${currency} ${item.savings_amount.toFixed(2)}`),
                            !isProduct && item.provider_level && React.createElement('div', {
                                className: "text-sm text-blue-600"
                            }, item.provider_level)
                        ),
                        React.createElement('div', {
                            className: "flex space-x-2"
                        },
                            React.createElement('button', {
                                className: "p-2 text-gray-500"
                            },
                                React.createElement(Share2, { className: "h-4 w-4" })
                            ),
                            React.createElement('button', {
                                onClick: () => window.open(item.affiliate_url || item.product_url || item.service_url, '_blank'),
                                className: "bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1"
                            },
                                React.createElement('span', {}, "View"),
                                React.createElement(ExternalLink, { className: "h-3 w-3" })
                            )
                        )
                    ),
                    
                    // Verification badges
                    (item.background_checked || item.licensed || item.insured) && React.createElement('div', {
                        className: "mt-2 flex items-center space-x-2"
                    },
                        React.createElement(Shield, { className: "h-4 w-4 text-green-600" }),
                        React.createElement('span', {
                            className: "text-sm text-green-600"
                        }, "Verified Provider")
                    )
                );
            };

            // Main render
            return React.createElement('div', {
                className: "min-h-screen bg-gray-50 pb-16"
            },
                // Header
                activeTab === 'search' && React.createElement(SearchHeader),
                
                // Content
                React.createElement('div', {
                    className: "flex-1"
                },
                    activeTab === 'search' && React.createElement('div', {
                        className: "p-4"
                    },
                        searchResults ? React.createElement('div', {},
                            // Results Summary
                            React.createElement('div', {
                                className: "mb-4 p-3 bg-blue-50 rounded-lg"
                            },
                                React.createElement('div', {
                                    className: "flex items-center justify-between"
                                },
                                    React.createElement('div', {},
                                        React.createElement('h3', {
                                            className: "font-semibold text-blue-900"
                                        }, `${searchResults.total_services || searchResults.total_products} results found`),
                                        React.createElement('p', {
                                            className: "text-sm text-blue-700"
                                        }, `Search completed in ${searchResults.search_duration_seconds}s`)
                                    ),
                                    React.createElement(Zap, { className: "h-6 w-6 text-blue-600" })
                                )
                            ),
                            
                            // Recommendations
                            searchResults.recommendations && searchResults.recommendations.length > 0 && React.createElement('div', {
                                className: "mb-4 p-3 bg-green-50 rounded-lg"
                            },
                                React.createElement('h4', {
                                    className: "font-semibold text-green-900 mb-2 flex items-center"
                                },
                                    React.createElement(Award, { className: "h-4 w-4 mr-2" }),
                                    "Smart Recommendations"
                                ),
                                React.createElement('div', {
                                    className: "space-y-1"
                                },
                                    searchResults.recommendations.slice(0, 2).map((rec, index) =>
                                        React.createElement('p', {
                                            key: index,
                                            className: "text-sm text-green-800"
                                        }, `• ${rec}`)
                                    )
                                )
                            ),
                            
                            // Results
                            React.createElement('div', {},
                                (searchResults.services || searchResults.products || []).map((item, index) =>
                                    React.createElement(ItemCard, {
                                        key: index,
                                        item: item,
                                        index: index
                                    })
                                )
                            )
                        ) : React.createElement('div', {
                            className: "text-center py-8"
                        },
                            React.createElement('div', {
                                className: "text-6xl mb-4"
                            }, "🔍"),
                            React.createElement('h3', {
                                className: "text-lg font-semibold text-gray-900 mb-2"
                            }, `Find the best ${searchType}`),
                            React.createElement('p', {
                                className: "text-gray-600 mb-6"
                            }, "Search across 12+ platforms to compare prices and find great deals"),
                            
                            // Quick Search Suggestions
                            React.createElement('div', {
                                className: "grid grid-cols-2 gap-3"
                            },
                                ['iPhone 15', 'Laptop', 'Web Design', 'Cleaning'].map((suggestion, index) =>
                                    React.createElement('button', {
                                        key: index,
                                        onClick: () => {
                                            setSearchQuery(suggestion);
                                            handleSearch();
                                        },
                                        className: "p-3 bg-white rounded-lg border border-gray-200 text-sm font-medium"
                                    }, suggestion)
                                )
                            )
                        )
                    ),
                    
                    // Other tabs content would go here
                    activeTab === 'favorites' && React.createElement('div', {
                        className: "p-4"
                    },
                        React.createElement('h2', {
                            className: "text-lg font-semibold mb-4"
                        }, "Favorites"),
                        favorites.length === 0 ? React.createElement('div', {
                            className: "text-center py-8 text-gray-500"
                        },
                            React.createElement(Heart, {
                                className: "h-12 w-12 mx-auto mb-4 text-gray-300"
                            }),
                            React.createElement('p', {}, "No favorites yet"),
                            React.createElement('p', {
                                className: "text-sm"
                            }, "Tap the heart icon on items to save them here")
                        ) : React.createElement('div', {
                            className: "space-y-2"
                        },
                            favorites.map((fav, index) =>
                                React.createElement('div', {
                                    key: index,
                                    className: "p-3 bg-gray-50 rounded-lg"
                                }, fav)
                            )
                        )
                    ),
                    
                    activeTab === 'recent' && React.createElement('div', {
                        className: "p-4"
                    },
                        React.createElement('h2', {
                            className: "text-lg font-semibold mb-4"
                        }, "Recent Searches"),
                        React.createElement('div', {
                            className: "space-y-2"
                        },
                            recentSearches.map((search, index) =>
                                React.createElement('button', {
                                    key: index,
                                    onClick: () => {
                                        setSearchQuery(search);
                                        setActiveTab('search');
                                    },
                                    className: "w-full text-left p-3 bg-gray-50 rounded-lg flex items-center justify-between"
                                },
                                    React.createElement('span', {}, search),
                                    React.createElement(ChevronRight, {
                                        className: "h-4 w-4 text-gray-400"
                                    })
                                )
                            )
                        )
                    ),
                    
                    activeTab === 'profile' && React.createElement('div', {
                        className: "p-4"
                    },
                        React.createElement('h2', {
                            className: "text-lg font-semibold mb-4"
                        }, "Profile"),
                        React.createElement('div', {
                            className: "space-y-4"
                        },
                            React.createElement('div', {
                                className: "bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-lg"
                            },
                                React.createElement('div', {
                                    className: "flex items-center space-x-3"
                                },
                                    React.createElement('div', {
                                        className: "w-12 h-12 bg-white/20 rounded-full flex items-center justify-center"
                                    },
                                        React.createElement(User, { className: "h-6 w-6" })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('h3', {
                                            className: "font-semibold"
                                        }, "Welcome to PricePulse"),
                                        React.createElement('p', {
                                            className: "text-sm opacity-90"
                                        }, "Smart shopping companion")
                                    )
                                )
                            ),
                            
                            React.createElement('div', {
                                className: "mt-6 p-4 bg-blue-50 rounded-lg"
                            },
                                React.createElement('h4', {
                                    className: "font-semibold text-blue-900 mb-2"
                                }, "About PricePulse"),
                                React.createElement('p', {
                                    className: "text-sm text-blue-800"
                                }, "Compare prices across 12+ platforms and find the best deals on products and services. Save money with smart recommendations and total cost transparency.")
                            )
                        )
                    )
                ),
                
                // Mobile Navigation
                React.createElement(MobileNav)
            );
        };

        // Render the app
        ReactDOM.render(React.createElement(PricePulseMobile), document.getElementById('root'));
    </script>

    <!-- Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
